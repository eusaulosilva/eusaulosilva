<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 116" width="1200" height="116" role="img" aria-label="Acesse meu portfólio oficial em eusaulosilva.com.br">
  <defs>
    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12121B" />
      <stop offset="55%" stop-color="#19132B" />
      <stop offset="100%" stop-color="#22133A" />
    </linearGradient>

    <linearGradient id="ctaBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E01B8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#9322FD" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9322FD" />
      <stop offset="100%" stop-color="#6E01B8" />
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, ui-monospace, monospace; }
    .btn-glow { animation: btnPulse 3.5s ease-in-out infinite; }
    @keyframes btnPulse {
      0%, 100% { opacity: 0.92; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Card Container -->
  <rect x="1" y="1" width="1198" height="114" rx="16" ry="16" fill="url(#ctaBg)" stroke="url(#ctaBorder)" stroke-width="1.5" />

  <!-- Left Accent Icon Box -->
  <rect x="28" y="26" width="64" height="64" rx="14" fill="#9322FD" fill-opacity="0.16" stroke="#C084FC" stroke-opacity="0.4" stroke-width="1.2" />
  <g transform="translate(46, 44)" fill="none" stroke="#C084FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="14" r="11" />
    <ellipse cx="14" cy="14" rx="5" ry="11" />
    <line x1="3" y1="14" x2="25" y2="14" />
  </g>

  <!-- Text Block -->
  <text x="114" y="51" class="sans" font-size="22" font-weight="700" fill="#F5F5F7">Explore meu Portfólio Profissional</text>
  <text x="114" y="79" class="sans" font-size="14.5" font-weight="400" fill="#B8B8C8">Trajetória completa, demos interativas, projetos em produção e gerador de currículo em PDF</text>

  <!-- Right CTA Button -->
  <g class="btn-glow" transform="translate(888, 32)">
    <rect x="0" y="0" width="280" height="52" rx="12" fill="url(#btnGrad)" stroke="#D8B4FE" stroke-opacity="0.45" stroke-width="1" />
    <text x="140" y="31.5" text-anchor="middle" class="mono" font-size="15.5" font-weight="700" fill="#FFFFFF">eusaulosilva.com.br  →</text>
  </g>
</svg>
