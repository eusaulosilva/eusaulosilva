<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Saulo Silva — Saulo.dev | Desenvolvedor Full Stack e Analista de Dados e BI">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B10" />
      <stop offset="55%" stop-color="#111119" />
      <stop offset="100%" stop-color="#171226" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="18%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#9322FD" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#6E01B8" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#0E0E12" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#9322FD" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0E0E12" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E01B8" />
      <stop offset="50%" stop-color="#9322FD" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A26" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#12121A" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#9322FD" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1" />
    </pattern>

    <clipPath id="outerClip">
      <rect x="1" y="1" width="1198" height="278" rx="18" ry="18" />
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, ui-monospace, monospace; }
    .pulse-aura { animation: auraPulse 6s ease-in-out infinite; }
    .pulse-dot { animation: dotPulse 2.2s ease-in-out infinite; }
    .blink-cursor { animation: cursorBlink 1.1s step-end infinite; }
    @keyframes auraPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <g clip-path="url(#outerClip)">
    <!-- Base obsidian background -->
    <rect x="0" y="0" width="1200" height="280" fill="url(#bgGrad)" />
    <rect x="0" y="0" width="1200" height="280" fill="url(#gridPattern)" />

    <!-- Violet ambient glows -->
    <ellipse class="pulse-aura" cx="220" cy="60" rx="420" ry="190" fill="url(#glowLeft)" />
    <ellipse class="pulse-aura" cx="1010" cy="220" rx="380" ry="170" fill="url(#glowRight)" />

    <!-- Top accent bar -->
    <rect x="0" y="0" width="1200" height="3.5" fill="url(#accentLine)" />

    <!-- Left Content Block -->
    <!-- Status Badge -->
    <rect x="52" y="36" width="298" height="28" rx="14" fill="#181824" stroke="#9322FD" stroke-opacity="0.45" stroke-width="1" />
    <circle class="pulse-dot" cx="70" cy="50" r="4.5" fill="#22C55E" />
    <text x="84" y="54.5" class="mono" font-size="11.5" font-weight="600" fill="#D8B4FE" letter-spacing="0.6">SAULO.DEV • BRASÍLIA, DF</text>

    <!-- Main Title -->
    <text x="52" y="122" class="sans" font-size="52" font-weight="800" fill="#F5F5F7" letter-spacing="-0.8">Saulo Silva</text>

    <!-- Role Subtitle -->
    <text x="52" y="156" class="sans" font-size="18.5" font-weight="500" fill="#C4C4D4">Desenvolvedor Full Stack &amp; Mobile  •  Analista de Dados &amp; BI</text>

    <!-- Signature Violet Divider -->
    <rect x="52" y="176" width="180" height="3.5" rx="1.75" fill="url(#accentLine)" />

    <!-- Tech Pillars Pills -->
    <g transform="translate(52, 198)">
      <rect x="0" y="0" width="166" height="32" rx="8" fill="#171722" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
      <text x="83" y="20.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="600" fill="#E9D5FF">React • Node.js</text>

      <rect x="178" y="0" width="178" height="32" rx="8" fill="#171722" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
      <text x="267" y="20.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="600" fill="#E9D5FF">Flutter • Firebase</text>

      <rect x="368" y="0" width="218" height="32" rx="8" fill="#171722" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
      <text x="477" y="20.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="600" fill="#E9D5FF">SQL • Python • Power BI</text>
    </g>

    <!-- Right Glassmorphic Code Card -->
    <g transform="translate(715, 34)">
      <rect x="0" y="0" width="435" height="212" rx="14" fill="url(#cardBg)" stroke="url(#borderGlow)" stroke-width="1.2" />

      <!-- Window Title Bar -->
      <rect x="0" y="0" width="435" height="34" rx="14" fill="#FFFFFF" fill-opacity="0.03" />
      <line x1="0" y1="34" x2="435" y2="34" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" />
      <circle cx="20" cy="17" r="5" fill="#FF5F56" />
      <circle cx="37" cy="17" r="5" fill="#FFBD2E" />
      <circle cx="54" cy="17" r="5" fill="#27C93F" />
      <text x="217" y="21" text-anchor="middle" class="mono" font-size="11.5" fill="#8B8B9E">profile.config.json</text>

      <!-- JSON Lines -->
      <text x="20" y="60" class="mono" font-size="13" fill="#8B8B9E">{</text>

      <text x="36" y="83" class="mono" font-size="13">
        <tspan fill="#C084FC">"dev"</tspan><tspan fill="#8B8B9E">: </tspan><tspan fill="#86EFAC">"Saulo Silva"</tspan><tspan fill="#8B8B9E">,</tspan>
      </text>

      <text x="36" y="106" class="mono" font-size="13">
        <tspan fill="#C084FC">"focus"</tspan><tspan fill="#8B8B9E">: </tspan><tspan fill="#86EFAC">"Full Stack &amp; Data BI"</tspan><tspan fill="#8B8B9E">,</tspan>
      </text>

      <text x="36" y="129" class="mono" font-size="13">
        <tspan fill="#C084FC">"degree"</tspan><tspan fill="#8B8B9E">: </tspan><tspan fill="#86EFAC">"Ciência da Computação"</tspan><tspan fill="#8B8B9E">,</tspan>
      </text>

      <text x="36" y="152" class="mono" font-size="13">
        <tspan fill="#C084FC">"postgrad"</tspan><tspan fill="#8B8B9E">: </tspan><tspan fill="#86EFAC">"Big Data Analytics"</tspan><tspan fill="#8B8B9E">,</tspan>
      </text>

      <text x="36" y="175" class="mono" font-size="13">
        <tspan fill="#C084FC">"portfolio"</tspan><tspan fill="#8B8B9E">: </tspan><tspan fill="#FDE047">"eusaulosilva.com.br"</tspan>
      </text>

      <text x="20" y="197" class="mono" font-size="13" fill="#8B8B9E">}</text>
      <rect class="blink-cursor" x="34" y="185" width="7.5" height="14" rx="1.5" fill="#C084FC" />
    </g>
  </g>

  <!-- Crisp outer border -->
  <rect x="1" y="1" width="1198" height="278" rx="18" ry="18" fill="none" stroke="url(#borderGlow)" stroke-width="1.2" />
</svg>
