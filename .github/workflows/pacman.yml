name: Generate Pacman

on:
  # Executa automaticamente a cada 12 horas (06:00 e 18:00 UTC, escalonado do workflow Snake)
  schedule:
    - cron: "0 6,18 * * *"

  # Permite executar manualmente na aba Actions
  workflow_dispatch:

  # Executa quando o próprio workflow é atualizado na branch main
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pacman.yml"

permissions:
  contents: write

concurrency:
  group: generate-pacman
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate Pacman SVGs
        uses: abozanona/pacman-contribution-graph@v5
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Pacman SVGs to output-pacman branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output-pacman
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
